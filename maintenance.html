<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#152838">
  <title>系统维护中 · URP 教务助手</title>
  <style>
    :root { color-scheme: dark; --ink: #f4f4f5; --muted: #c4c4cc; --accent: #93c5fd; --panel: rgba(24,24,27,.94); --line: #52525b; font-family: system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background: #152838; color: var(--ink); -webkit-font-smoothing: antialiased; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; min-height: 100dvh; }
    button, select { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: transparent; transition: background .2s,color .2s; }
    button:hover:not(:disabled) { background: #b9d3e51c; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    button:disabled { cursor: default; opacity: .45; }
    [hidden] { display: none !important; }
    .landscape { position: fixed; inset: 0; background: #152838; }
    .landscape iframe { width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .65s; }
    body[data-scene-state="ready"] .landscape iframe { opacity: 1; }
    .shade { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(180deg,#09132170,transparent 24%,transparent 74%,#09132185); }
    .page { position: relative; min-height: 100vh; min-height: 100dvh; pointer-events: none; }
    .brand { position: fixed; top: 34px; left: 38px; pointer-events: none; }
    .brand-label { margin: 0; font-size: 11px; letter-spacing: .16em; color: #cad3dc; }
    .scene-title { font-family: "Songti SC","Noto Serif CJK SC",serif; font-weight: 400; letter-spacing: .18em; font-size: 42px; margin: 13px 0 8px; max-width: 12ch; line-height: 1.3; }
    .brand-caption { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .12em; }
    .brand-line { height: 1px; width: 36px; background: var(--accent); margin-top: 21px; }
    .tools { position: fixed; top: 34px; right: 32px; display: flex; align-items: center; gap: 6px; padding: 5px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); backdrop-filter: blur(15px); pointer-events: auto; }
    .icon { display: grid; place-items: center; flex: 0 0 auto; width: 44px; height: 44px; border-radius: 8px; color: #d2dce4; }
    .icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .motion-symbol { font-size: 23px; font-weight: 400; line-height: 1; }
    .icon.active { color: var(--accent); background: #93c5fd1a; }
    .notice-toggle { min-height: 44px; padding: 9px 15px; border-radius: 8px; font-size: 13px; white-space: nowrap; }
    .notice-toggle[aria-expanded="true"] { color: var(--accent); background: #93c5fd1a; }
    .main-content { pointer-events: auto; }
    .message { position: fixed; left: 38px; top: 184px; width: 350px; max-height: calc(100dvh - 324px); overflow: auto; padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); backdrop-filter: blur(15px); scrollbar-width: thin; }
    .notice-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: -6px -8px 10px 0; }
    .eyebrow { margin: 0; color: var(--accent); font-size: 12px; letter-spacing: .08em; }
    .notice-close { min-width: 52px; min-height: 44px; border-radius: 8px; font-size: 12px; color: var(--muted); }
    h1 { margin: 0; font-size: 26px; font-weight: 650; line-height: 1.35; letter-spacing: -.02em; }
    .description { margin: 15px 0 0; font-size: 13px; line-height: 1.8; color: var(--muted); }
    .actions { margin-top: 22px; }
    .retry { min-height: 44px; padding: 11px 22px; border: 1px solid var(--accent); border-radius: 8px; color: #26303b; background: var(--accent); font-size: 13px; font-weight: 600; }
    .retry:hover { background: #bfdbfe; }
    .retry-hint, .scene-note { margin: 12px 0 0; color: var(--muted); font-size: 11px; line-height: 1.8; }
    .bottom { position: fixed; bottom: max(30px,env(safe-area-inset-bottom)); left: 34px; right: 34px; display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; pointer-events: auto; }
    .views { display: flex; gap: 3px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 6px; background: var(--panel); backdrop-filter: blur(16px); }
    .view { min-height: 44px; padding: 12px 17px; border-radius: 8px; text-align: left; font-size: 14px; color: #c6d0d8; white-space: nowrap; }
    .view span { font: 10px ui-monospace,monospace; margin-right: 10px; color: #93a7b7; }
    .view.active { color: #26303b; background: var(--accent); }
    .view.active span { color: #675d6a; }
    .atmosphere { text-align: right; }
    .section-label { display: block; font-size: 10px; letter-spacing: .14em; margin: 0 0 12px; color: #c0ccd5; }
    .weather { display: flex; gap: 4px; padding: 5px; border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(16px); border-radius: 12px; }
    .weather-button { min-height: 44px; padding: 11px 15px; border-radius: 8px; color: #c9d3dc; font-size: 13px; white-space: nowrap; }
    .weather-button.active { background: #d3dfec22; color: #f0eef0; box-shadow: inset 0 -2px var(--accent); }
    .scene-picker { position: fixed; right: 34px; top: 105px; display: flex; gap: 10px; align-items: center; font-size: 12px; color: #c0cbd5; pointer-events: auto; }
    .scene-picker select { max-width: min(240px,60vw); min-height: 44px; padding: 8px 30px 8px 12px; background: #152532; border: 1px solid var(--line); border-radius: 8px; }
    .hint { position: fixed; bottom: 108px; left: 39px; margin: 0; color: #b8c5cf; font-size: 11px; letter-spacing: .05em; pointer-events: none; }
    #restore { position: fixed; right: 22px; top: 22px; z-index: 3; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; pointer-events: auto; }
    @media (max-width: 900px) {
      .brand { top: 25px; left: 23px; max-width: calc(100vw - 195px); }
      .brand-label { font-size: 10px; letter-spacing: .08em; }
      .scene-title { font-size: 32px; margin-top: 10px; max-width: 100%; }
      .brand-caption { font-size: 10px; letter-spacing: .08em; }
      .brand-line { margin-top: 15px; }
      .tools { top: 22px; right: 18px; display: grid; grid-template-columns: repeat(3,44px); gap: 3px; }
      .notice-toggle { grid-column: 1 / -1; }
      .scene-picker { top: 130px; right: 18px; }
      .message { top: 154px; left: 16px; width: min(350px,100% - 32px); max-height: calc(100dvh - 374px); padding: 19px 21px; }
      h1 { font-size: 25px; }
      .description { margin-top: 12px; line-height: 1.75; }
      .actions { margin-top: 18px; }
      .retry { width: 100%; }
      .bottom { bottom: max(17px,env(safe-area-inset-bottom)); left: 16px; right: 16px; flex-direction: column; align-items: stretch; gap: 10px; }
      .views { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
      .view { padding: 10px 12px; font-size: 13px; }
      .view span { margin-right: 8px; }
      .atmosphere { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .section-label { margin: 0; font-size: 10px; letter-spacing: .06em; }
      .weather { padding: 3px; gap: 2px; }
      .weather-button { padding: 9px 12px; font-size: 12px; }
      .hint { bottom: 193px; left: 21px; font-size: 10px; }
      body.has-scene-picker .message { top: 188px; max-height: calc(100dvh - 408px); }
    }
    @media (max-width: 360px) { .weather-button { padding: 9px 9px; } .hint { letter-spacing: 0; } }
    @media (max-height: 540px) { .message { top: 132px; max-height: calc(100dvh - 310px); } }
    @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) { :root { --panel: #132330; --line: #8295a6; } .tools,.message,.views,.weather { backdrop-filter: none; } }
    @supports not (backdrop-filter: blur(1px)) { :root { --panel: #132330; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition: none !important; } }

    /* Self-contained Nova controls: usable while Flask/static resources are offline. */
    .message, .tools, .views, .weather { box-shadow: 0 8px 28px #0002; }
    .message { border-color: var(--line); }
    .brand-label, .brand-caption, .hint, .section-label { color: #e4e4e7; text-shadow: 0 1px 4px #0008; }
    .icon, .view, .weather-button { color: var(--muted); }
    .view.active, .retry { color: #18181b; }
    .view.active span { color: #3f3f46; }
    .weather-button.active { color: var(--ink); background: #ffffff18; }
    @media (prefers-color-scheme: light) {
      :root { color-scheme: light; --ink: #18181b; --muted: #52525b; --accent: #2055a2; --panel: rgba(255,255,255,.96); --line: #d4d4d8; }
      .scene-title { color: #f4f4f5; text-shadow: 0 1px 8px #0008; }
      .view.active, .retry { color: #fff; }
      .view.active span { color: #e4e4e7; }
      .notice-toggle[aria-expanded="true"], .icon.active { background: #2055a20d; }
      .weather-button.active { background: #2055a212; color: var(--accent); }
      .retry:hover { background: #173e7b; }
      button:hover:not(:disabled) { background: #18181b0a; }
      .retry:hover:not(:disabled) { background: #173e7b; }
    }
    @media (max-width: 768px) { .tools { top: max(16px, env(safe-area-inset-top)); } }
    @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) { :root { --panel: #18181b; } }
    @media (prefers-color-scheme: light) and (prefers-reduced-transparency: reduce), (prefers-color-scheme: light) and (prefers-contrast: more) { :root { --panel: #fff; } }
  </style>
</head>
<body data-scene-state="loading">
  <div class="landscape" aria-hidden="true">
    <iframe id="landscape" title="樱花山谷景观" tabindex="-1" sandbox="allow-scripts allow-same-origin" referrerpolicy="no-referrer"></iframe>
  </div>
  <div class="shade" aria-hidden="true"></div>
  <div class="page">
    <header class="brand ui">
      <p class="brand-label">URP 教务助手</p>
      <p class="scene-title" id="scene-name">花溪</p>
      <p class="brand-caption">系统维护中</p>
      <div class="brand-line" aria-hidden="true"></div>
    </header>
    <div class="tools ui" id="tools" role="toolbar" aria-label="画面控制" hidden>
      <button class="icon active" id="motion" type="button" aria-label="暂停动画" title="暂停动画" aria-pressed="false" disabled><span class="motion-symbol" id="motion-symbol" aria-hidden="true">Ⅱ</span></button>
      <button class="icon" id="reset-view" type="button" aria-label="重置视角" title="重置视角" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg></button>
      <button class="icon" id="hide-ui" type="button" aria-label="隐藏界面" title="隐藏界面 · H"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="notice-toggle" id="notice-toggle" type="button" aria-controls="service-notice" aria-expanded="true" title="隐藏服务通知">服务通知</button>
    </div>
    <main class="main-content" id="service-notice" aria-labelledby="page-title">
      <section class="message">
        <div class="notice-heading"><p class="eyebrow">服务通知</p><button class="notice-close" id="notice-close" type="button" hidden>关闭</button></div>
        <h1 id="page-title">教务助手正在维护</h1>
        <p class="description">课表、成绩、考试等功能暂时无法使用。你可以在这里看看风景，稍后再试。</p>
        <form class="actions" id="retry-form" method="get">
          <button class="retry" type="submit">刷新页面</button>
          <p class="retry-hint">维护结束后，刷新页面即可继续使用。</p>
        </form>
        <p class="scene-note" id="scene-note" role="status" hidden>正在载入景观…</p>
        <noscript><p class="scene-note">开启 JavaScript 后可以欣赏景观，刷新页面仍可使用。</p></noscript>
      </section>
    </main>
    <footer class="bottom ui" id="scene-footer" hidden>
      <nav class="views" id="view-controls" aria-label="选择视角"></nav>
      <div class="atmosphere" id="weather-picker"><span class="section-label">光与天气</span><div class="weather" id="weather-controls" role="group" aria-label="选择天气"></div></div>
    </footer>
    <label class="scene-picker ui" id="scene-picker" hidden>景观<select id="scene-select" aria-label="选择景观"></select></label>
    <p class="hint ui" id="scene-hint" hidden>拖动观察 · 滚轮靠近 · H 隐藏界面</p>
    <button class="icon" id="restore" type="button" aria-label="显示界面" title="显示界面 · H" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
  <!-- 添加景观：把独立 HTML 放进 maintenance-scenes，并在此登记；无需 Flask。 -->
  <script id="landscape-catalog" type="application/json">
    [{
      "id": "sakura-valley",
      "name": "花溪 · 樱花山谷",
      "file": "sakura-valley.html?v=20261003-2",
      "controls": true,
      "views": [[0, "山谷全景"], [1, "河畔低机位"], [2, "寺庙小径"], [3, "山坡俯瞰"]],
      "weather": [["blue", "蓝调时刻"], ["morning", "清晨"], ["rain", "雨中"]]
    }]
  </script>
  <script>
    (() => {
      const frame = document.getElementById('landscape');
      const note = document.getElementById('scene-note');
      const sceneSelect = document.getElementById('scene-select');
      const viewGroup = document.getElementById('view-controls');
      const weatherGroup = document.getElementById('weather-controls');
      const motion = document.getElementById('motion');
      const reset = document.getElementById('reset-view');
      const notice = document.getElementById('service-notice');
      const noticeToggle = document.getElementById('notice-toggle');
      const restore = document.getElementById('restore');
      const hideUi = document.getElementById('hide-ui');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)');
      const localFile = location.protocol === 'file:';
      const messageOrigin = localFile ? '*' : location.origin;
      let paused = reduced.matches, noticeHidden = false, uiHidden = false;
      let current, timeout, catalog, pendingCheck;
      let instance = 0, activeInstance = null, selectedView = '', selectedWeather = '';
      document.getElementById('retry-form').addEventListener('submit', event => { event.preventDefault(); location.reload(); });
      function syncUi() {
        notice.hidden = noticeHidden || uiHidden;
        noticeToggle.setAttribute('aria-expanded', String(!noticeHidden));
        noticeToggle.title = noticeHidden ? '显示服务通知' : '隐藏服务通知';
        document.querySelector('.brand').hidden = uiHidden;
        document.getElementById('tools').hidden = uiHidden;
        document.getElementById('scene-footer').hidden = uiHidden || !current?.controls;
        document.getElementById('scene-hint').hidden = uiHidden || document.body.dataset.sceneState !== 'ready' || !current?.controls;
        document.getElementById('scene-picker').hidden = uiHidden || !catalog || catalog.length < 2;
        restore.hidden = !uiHidden;
      }
      function setNoticeHidden(hidden, focus = false) {
        noticeHidden = hidden;
        syncUi();
        if (focus) noticeToggle.focus();
      }
      function setUiHidden(hidden, focus = false) {
        uiHidden = hidden;
        syncUi();
        if (focus) (hidden ? restore : hideUi).focus();
      }
      noticeToggle.addEventListener('click', () => setNoticeHidden(!noticeHidden));
      document.getElementById('notice-close').addEventListener('click', () => setNoticeHidden(true, true));
      hideUi.addEventListener('click', () => setUiHidden(true, true));
      restore.addEventListener('click', () => setUiHidden(false, true));
      document.addEventListener('keydown', event => {
        if (event.repeat || event.ctrlKey || event.altKey || event.metaKey || event.target.closest('input,select,textarea,[contenteditable="true"]')) return;
        if (event.key.toLowerCase() === 'h') { event.preventDefault(); setUiHidden(!uiHidden, true); }
        if (event.key === 'Escape' && uiHidden) { event.preventDefault(); setUiHidden(false, true); }
      });
      function setMotionLabel() {
        const label = paused ? '播放动画' : '暂停动画';
        motion.setAttribute('aria-label', label);
        motion.setAttribute('aria-pressed', String(paused));
        motion.classList.toggle('active', !paused);
        document.getElementById('motion-symbol').textContent = paused ? '▷' : 'Ⅱ';
        motion.disabled = document.body.dataset.sceneState !== 'ready' || reduced.matches || !current?.controls;
        motion.title = reduced.matches ? '已遵循系统的减少动态效果设置' : label;
      }
      function send(action, value) {
        if (document.body.dataset.sceneState === 'ready' && current.controls) frame.contentWindow.postMessage({ type: 'landscape:control', action, value }, messageOrigin);
      }
      function updateChoices() {
        for (const [group, value] of [[viewGroup, selectedView], [weatherGroup, selectedWeather]]) {
          for (const button of group.querySelectorAll('button')) {
            const active = button.dataset.value === value;
            button.classList.toggle('active', active);
            button.setAttribute('aria-pressed', String(active));
            button.disabled = document.body.dataset.sceneState !== 'ready' || !current?.controls;
          }
        }
        reset.disabled = document.body.dataset.sceneState !== 'ready' || !current?.controls;
        reset.hidden = motion.hidden = !current?.controls;
        setMotionLabel();
      }
      function createChoices(group, entries, type) {
        group.replaceChildren(...entries.map(([value, label], index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = type === 'view' ? 'view' : 'weather-button';
          button.dataset.value = String(value);
          if (type === 'view') {
            const number = document.createElement('span');
            number.textContent = String(index + 1).padStart(2, '0');
            number.setAttribute('aria-hidden', 'true');
            button.append(number);
          }
          button.append(document.createTextNode(label));
          button.addEventListener('click', () => {
            if (type === 'view') selectedView = String(value); else selectedWeather = String(value);
            updateChoices();
            send(type, type === 'view' ? Number(value) : String(value));
          });
          return button;
        }));
      }
      function failScene() {
        clearTimeout(timeout);
        pendingCheck?.abort();
        activeInstance = null;
        document.body.dataset.sceneState = 'error';
        note.hidden = false;
        note.textContent = '景观暂时无法载入，维护结束后仍可刷新页面继续使用。';
        frame.removeAttribute('src');
        noticeHidden = uiHidden = false;
        updateChoices();
        syncUi();
      }
      function readyScene() {
        if (document.body.dataset.sceneState !== 'loading') return;
        clearTimeout(timeout);
        document.body.dataset.sceneState = 'ready';
        note.hidden = true;
        updateChoices();
        syncUi();
        send('paused', paused);
        if (selectedView !== '') send('view', Number(selectedView));
        if (selectedWeather) send('weather', selectedWeather);
      }
      function startTimeout() {
        clearTimeout(timeout);
        if (!document.hidden && document.body.dataset.sceneState === 'loading') timeout = setTimeout(failScene, 18000);
      }
      function loadScene(scene) {
        clearTimeout(timeout);
        pendingCheck?.abort();
        frame.removeAttribute('src');
        const check = pendingCheck = new AbortController();
        const loadingInstance = activeInstance = String(++instance);
        current = scene;
        document.body.dataset.sceneState = 'loading';
        note.textContent = '正在载入景观…';
        note.hidden = false;
        frame.title = scene.name;
        document.getElementById('scene-name').textContent = scene.name.split(' · ')[0];
        createChoices(viewGroup, scene.views || [], 'view');
        createChoices(weatherGroup, scene.weather || [], 'weather');
        selectedView = String(scene.views?.[0]?.[0] ?? '');
        selectedWeather = (scene.weather || []).some(([value]) => value === 'blue') ? 'blue' : String(scene.weather?.[0]?.[0] ?? '');
        document.getElementById('weather-picker').hidden = !scene.controls || !scene.weather?.length;
        viewGroup.hidden = !scene.controls || !scene.views?.length;
        document.body.classList.toggle('has-scene-picker', catalog.length > 1);
        updateChoices();
        syncUi();
        const url = new URL((localFile ? 'maintenance-scenes/' : '/maintenance-scenes/') + scene.file, location.href);
        url.searchParams.set('embed', 'maintenance');
        url.searchParams.set('instance', loadingInstance);
        startTimeout();
        if (localFile) { frame.src = url.href; return; }
        fetch(url, { method: 'HEAD', signal: check.signal }).then(response => {
          if (activeInstance !== loadingInstance) return;
          if (!response.ok) { failScene(); return; }
          frame.src = url.href;
        }).catch(error => { if (error.name !== 'AbortError' && activeInstance === loadingInstance) failScene(); });
      }
      frame.addEventListener('error', failScene);
      frame.addEventListener('load', () => {
        if (!frame.hasAttribute('src')) return;
        if (localFile) { if (!current.controls) readyScene(); return; }
        try {
          const doc = frame.contentDocument;
          if (doc && new URL(doc.URL).searchParams.get('instance') !== activeInstance) return;
          if (!doc || !doc.body) failScene(); else if (!current.controls) readyScene();
        } catch { failScene(); }
      });
      addEventListener('message', event => {
        const sameOrigin = event.origin === location.origin || (localFile && event.origin === 'null');
        if (event.source !== frame.contentWindow || !sameOrigin || !event.data || !activeInstance || event.data.instance !== activeInstance) return;
        if (event.data.type === 'landscape:ready') readyScene();
        if (event.data.type === 'landscape:error') failScene();
        if (event.data.type === 'landscape:toggle-ui') setUiHidden(!uiHidden, true);
        if (event.data.type === 'landscape:show-ui') setUiHidden(false, true);
      });
      sceneSelect.addEventListener('change', () => loadScene(catalog.find(scene => scene.id === sceneSelect.value)));
      motion.addEventListener('click', () => { paused = !paused; setMotionLabel(); send('paused', paused); });
      reset.addEventListener('click', () => send('view', Number(selectedView)));
      reduced.addEventListener('change', () => { paused = reduced.matches; setMotionLabel(); send('paused', paused); });
      document.addEventListener('visibilitychange', startTimeout);
      try {
        catalog = JSON.parse(document.getElementById('landscape-catalog').textContent);
        if (!Array.isArray(catalog) || !catalog.length || catalog.some(scene => !/^[a-z0-9-]+\.html(?:\?v=[a-z0-9-]+)?$/.test(scene.file))) throw new Error('Invalid landscape catalog');
        sceneSelect.replaceChildren(...catalog.map(scene => new Option(scene.name, scene.id)));
        document.getElementById('notice-close').hidden = false;
        document.getElementById('scene-hint').textContent = matchMedia('(max-width:900px)').matches ? '单指观察 · 双指缩放 · H 隐藏界面' : '拖动观察 · 滚轮靠近 · H 隐藏界面';
        loadScene(catalog[0]);
      } catch { failScene(); }
    })();
