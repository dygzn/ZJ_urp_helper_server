<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f3f6fa">
  <title>系统维护中 · URP 教务助手</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f3f6fa;
      --surface: #fff;
      --surface-soft: #f8fafc;
      --ink: #182638;
      --muted: #526276;
      --subtle: #65768a;
      --line: #dce4ed;
      --accent: #2055a2;
      --accent-hover: #173e7b;
      --accent-soft: #e9f0fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--canvas);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: var(--canvas);
    }

    button { font: inherit; }

    .page {
      display: flex;
      flex-direction: column;
      width: min(100% - 48px, 1120px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 84px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 9px;
      color: #fff;
      background: var(--accent);
    }

    .header-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--surface);
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .main-content {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(340px, .92fr);
      align-items: center;
      gap: clamp(44px, 7vw, 100px);
      flex: 1;
      padding: clamp(58px, 8vh, 92px) 0 clamp(52px, 7vh, 80px);
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(46px, 5.6vw, 70px);
      font-weight: 750;
      letter-spacing: -.055em;
      line-height: 1.15;
    }

    .description {
      max-width: 35ch;
      margin: 23px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 1.7vw, 18px);
      line-height: 1.8;
    }

    .actions { margin-top: 34px; }

    .retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 148px;
      min-height: 48px;
      padding: 10px 22px;
      border: 1px solid var(--accent);
      border-radius: 9px;
      color: #fff;
      background: var(--accent);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color .18s ease, border-color .18s ease, transform .18s ease;
    }

    .retry:hover { border-color: var(--accent-hover); background: var(--accent-hover); }
    .retry:active { transform: scale(.98); }
    .retry:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    .retry-hint {
      margin: 13px 0 0;
      color: var(--subtle);
      font-size: 13px;
      line-height: 1.65;
    }

    .status-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
    }

    .card-header,
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 22px;
    }

    .card-header { border-bottom: 1px solid var(--line); }
    .card-header span { color: var(--muted); font-size: 13px; font-weight: 650; }
    .card-header strong { color: var(--accent); font-size: 13px; font-weight: 750; }

    .status-graphic {
      display: grid;
      place-items: center;
      min-height: 286px;
      padding: 24px;
      background: var(--surface-soft);
    }

    .pause-ring {
      display: grid;
      place-items: center;
      width: 212px;
      height: 212px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      box-shadow: inset 0 0 0 18px var(--surface-soft), inset 0 0 0 19px var(--line);
    }

    .pause-core {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: var(--accent-soft);
    }

    .pause-core span {
      width: 11px;
      height: 45px;
      border-radius: 4px;
      background: var(--accent);
    }

    .card-footer { border-top: 1px solid var(--line); }
    .card-footer span { color: var(--subtle); font-size: 13px; }
    .card-footer strong { color: var(--ink); font-size: 14px; font-weight: 700; }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 32px;
      padding: 25px 0 31px;
      border-top: 1px solid var(--line);
    }

    .detail h2 {
      margin: 0 0 7px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 750;
    }

    .detail p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .site-footer {
      padding: 0 0 26px;
      color: var(--subtle);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 780px) {
      .main-content {
        grid-template-columns: minmax(0, 1fr);
        gap: 42px;
        padding: 50px 0 45px;
      }
      .description { max-width: 42ch; }
      .status-graphic { min-height: 250px; }
    }

    @media (max-width: 520px) {
      .page { width: min(100% - 36px, 1120px); }
      .site-header { min-height: 72px; }
      .brand { font-size: 14px; }
      .brand-mark { width: 34px; height: 34px; }
      .header-status { padding: 0 9px; font-size: 12px; }
      .main-content { gap: 35px; padding: 44px 0 38px; }
      .eyebrow { margin-bottom: 14px; }
      h1 { font-size: clamp(40px, 10.7vw, 54px); }
      .description { margin-top: 18px; font-size: 16px; }
      .actions { margin-top: 26px; }
      .retry { width: 100%; }
      .status-graphic { min-height: 206px; }
      .pause-ring { width: 154px; height: 154px; box-shadow: inset 0 0 0 12px var(--surface-soft), inset 0 0 0 13px var(--line); }
      .pause-core { width: 86px; height: 86px; gap: 10px; }
      .pause-core span { width: 9px; height: 33px; }
      .card-header, .card-footer { padding: 15px 17px; }
      .details { grid-template-columns: 1fr; gap: 19px; padding: 23px 0 25px; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --canvas: #121b27;
        --surface: #1d2a3a;
        --surface-soft: #172332;
        --ink: #f1f5fa;
        --muted: #c6d2e0;
        --subtle: #aebed0;
        --line: #35465a;
        --accent: #92baf0;
        --accent-hover: #bad3f5;
        --accent-soft: #29415f;
      }
      .brand-mark, .retry { color: #142235; background: #a9c9f2; border-color: #a9c9f2; }
      .retry:hover { color: #142235; background: #c3daf7; border-color: #c3daf7; }
      .status-dot, .pause-core span { background: #a9c9f2; }
    }

    @media (prefers-reduced-motion: reduce) {
      .retry { transition: none; }
      .retry:active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19V9l8-5 8 5v10"></path>
            <path d="M9 19v-6h6v6"></path>
          </svg>
        </span>
        <span>URP 教务助手</span>
      </div>
      <span class="header-status"><span class="status-dot" aria-hidden="true"></span>维护中</span>
    </header>

    <main class="main-content" aria-labelledby="page-title">
      <div class="message">
        <p class="eyebrow">服务通知</p>
        <h1 id="page-title">教务助手<br>正在维护</h1>
        <p class="description">我们正在进行系统维护。课表、成绩、考试等功能暂时无法使用，请稍后再试。</p>
        <div class="actions">
          <button class="retry" type="button" onclick="window.location.reload()">刷新页面</button>
          <p class="retry-hint">如果刷新后仍看到此页，请稍后再试。</p>
        </div>
      </div>

      <aside class="status-card" aria-label="当前服务状态">
        <div class="card-header"><span>当前状态</span><strong>系统维护中</strong></div>
        <div class="status-graphic" aria-hidden="true">
          <div class="pause-ring"><div class="pause-core"><span></span><span></span></div></div>
        </div>
        <div class="card-footer"><span>教务助手服务</span><strong>暂不可用</strong></div>
      </aside>
    </main>

    <section class="details" aria-label="维护说明">
      <div class="detail">
        <h2>受影响的功能</h2>
        <p>课表、成绩、考试等查询暂时无法使用。</p>
      </div>
      <div class="detail">
        <h2>恢复访问</h2>
        <p>维护结束后，刷新页面即可继续使用。</p>
      </div>
    </section>
    <footer class="site-footer">URP 教务助手 · 感谢你的理解</footer>
  </div>
</body>
</html>
