<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F5F5F7">
  <title>系统维护中 · URP 教务助手</title>
  <style>
    :root {
      color-scheme: light;
      --bg-primary: #FFFFFF;
      --bg-secondary: #F5F5F7;
      --text-primary: #1D1D1F;
      --text-secondary: #6E6E73;
      --text-tertiary: #86868B;
      --accent: #007AFF;
      --accent-hover: #0051D5;
      --divider: #E8E8ED;
      --card-radius: 16px;
      --card-shadow: 0 2px 8px rgba(0, 0, 0, .04);
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", "SF Pro Display", sans-serif;
      color: var(--text-primary);
      background: var(--bg-secondary);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background: var(--bg-secondary);
    }

    .card {
      width: min(100%, 560px);
      overflow: hidden;
      border: 1px solid var(--divider);
      border-radius: var(--card-radius);
      background: var(--bg-primary);
      box-shadow: var(--card-shadow);
    }

    .content { padding: clamp(26px, 6vw, 40px); }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .02em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #fff;
      background: var(--accent);
    }

    .illustration {
      width: 92px;
      height: 92px;
      display: grid;
      place-items: center;
      margin: 34px auto 24px;
      border: 1px solid var(--divider);
      border-radius: 50%;
      background: var(--bg-secondary);
    }

    .illustration svg { width: 62px; height: 62px; }

    .eyebrow {
      width: fit-content;
      margin: 0 auto 12px;
      padding: 5px 10px;
      border-radius: 7px;
      color: var(--accent);
      background: rgba(0, 122, 255, .1);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: var(--text-primary);
      font-size: clamp(25px, 5vw, 28px);
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.4;
      text-align: center;
    }

    .description {
      max-width: 470px;
      margin: 17px auto 0;
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1.9;
      text-align: center;
    }

    .notice {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin: 30px 0 0;
      padding: 15px 17px;
      border: 1px solid var(--divider);
      border-radius: 12px;
      color: var(--text-secondary);
      background: var(--bg-secondary);
      font-size: 14px;
      line-height: 1.7;
    }

    .notice svg { flex: 0 0 19px; margin-top: 2px; color: var(--accent); }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 27px;
    }

    .retry {
      min-height: 46px;
      padding: 0 22px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: var(--accent);
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s cubic-bezier(.4, 0, .2, 1);
    }

    .retry:hover {
      background: var(--accent-hover);
    }

    .retry:focus-visible { outline: 2px solid rgba(0, 122, 255, .5); outline-offset: 3px; }

    footer {
      margin-top: 34px;
      color: var(--text-tertiary);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .content { padding: 28px 22px 30px; }
      .illustration { width: 84px; height: 84px; margin: 30px auto 22px; }
      .illustration svg { width: 56px; height: 56px; }
      .description { font-size: 15px; }
      .notice { margin-top: 24px; padding: 13px 14px; }
      footer { margin-top: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="page-title">
    <div class="content">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19V9l8-5 8 5v10"></path>
            <path d="M9 19v-6h6v6"></path>
          </svg>
        </span>
        <span>URP 教务助手</span>
      </div>

      <div class="illustration" aria-hidden="true">
        <svg viewBox="0 0 80 80" fill="none">
          <circle cx="40" cy="40" r="29" fill="#fff" stroke="#D2D2D7" stroke-width="2"></circle>
          <path d="M40 22v19l12 7" stroke="#007AFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="40" cy="40" r="3.5" fill="#007AFF"></circle>
          <path d="M20 19l5 5M60 19l-5 5M40 11v5" stroke="#86868B" stroke-width="3" stroke-linecap="round"></path>
          <path d="M17 57c5 6 13 10 23 10s18-4 23-10" stroke="#D2D2D7" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 5"></path>
          <circle cx="62" cy="55" r="7" fill="#fff" stroke="#D2D2D7" stroke-width="2"></circle>
          <path d="M59.5 55l1.7 1.7 3.4-3.7" stroke="#007AFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>

      <p class="eyebrow">服务暂时不可用</p>
      <h1 id="page-title">系统正在维护升级</h1>
      <p class="description">
        我们正在对教务助手进行维护与优化。维护期间，课表、成绩等服务暂时无法使用，请稍后再来。
      </p>

      <div class="notice">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 11v5M12 8h.01"></path>
        </svg>
        <span>维护完成后，页面会恢复访问。给你带来的不便，敬请谅解。</span>
      </div>

      <div class="actions">
        <button class="retry" type="button" onclick="window.location.reload()">重新尝试访问</button>
      </div>

      <footer>感谢你的耐心与理解</footer>
    </div>
  </main>
</body>
</html>
