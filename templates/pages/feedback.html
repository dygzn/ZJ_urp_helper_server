<div class="card feedback-container">
    <h2>反馈建议</h2>
    <div class="feedback-form">
        <textarea id="new-feedback-content" class="feedback-textarea" rows="4" placeholder="请输入您的反馈或建议..."></textarea>
        <div class="feedback-form-footer">
            <div class="feedback-visibility-select">
                <label class="visibility-option">
                    <input type="radio" name="feedback-visibility" value="self" checked>
                    <span>仅自己可见</span>
                </label>
                <label class="visibility-option">
                    <input type="radio" name="feedback-visibility" value="public">
                    <span>所有人可见</span>
                </label>
            </div>
            <button class="btn-primary" onclick="submitNewFeedback()">提交反馈</button>
        </div>
    </div>
    <div id="feedback-list-content" class="feedback-list-content">
        <div class="loading">加载中</div>
    </div>
</div>
