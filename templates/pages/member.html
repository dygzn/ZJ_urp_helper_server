<div class="card" id="member-status-card">
    <div class="loading">加载中</div>
</div>
<div class="member-plans">
    <div class="member-plan-card member-plan-basic">
        <div class="plan-badge">初级会员</div>
        <div class="plan-price">¥<span class="price-num">3</span><span class="price-unit">/半年</span></div>
        <ul class="plan-features">
            <li><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2 8 6 12 14 4"/></svg>所有基础功能</li>
            <li class="plan-feature-extra" id="basic-extra-features">（功能持续扩展中）</li>
        </ul>
        <button class="btn-plan btn-basic" onclick="showPayDialog('basic')">立即开通 ¥3</button>
    </div>
    <div class="member-plan-card member-plan-advanced">
        <div class="plan-badge plan-badge-advanced">高级会员</div>
        <div class="plan-price">¥<span class="price-num">5</span><span class="price-unit">/半年</span></div>
        <ul class="plan-features">
            <li><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2 8 6 12 14 4"/></svg>包含初级会员所有功能</li>
            <li><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2 8 6 12 14 4"/></svg>高级专属功能</li>
            <li class="plan-feature-extra" id="advanced-extra-features">（功能持续扩展中）</li>
        </ul>
        <button class="btn-plan btn-advanced" onclick="showPayDialog('advanced')">立即开通 ¥5</button>
    </div>
</div>
<div class="card" id="active-pay-links" style="display:none;background:var(--bg-warning, #fff8e1);border:1px solid var(--color-warning, #f0c040);"></div>
