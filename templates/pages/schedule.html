<div class="card schedule-container">
    <div id="schedule-content" class="schedule-content">
        <div id="schedule-message" class="schedule-message" style="display:none;"></div>
        <div class="schedule-header">
            <div class="schedule-header-time"></div>
            <div class="schedule-header-day" id="schedule-day-1"><div class="schedule-day-date" id="schedule-date-1"></div><div class="schedule-day-name">周一</div></div>
            <div class="schedule-header-day" id="schedule-day-2"><div class="schedule-day-date" id="schedule-date-2"></div><div class="schedule-day-name">周二</div></div>
            <div class="schedule-header-day" id="schedule-day-3"><div class="schedule-day-date" id="schedule-date-3"></div><div class="schedule-day-name">周三</div></div>
            <div class="schedule-header-day" id="schedule-day-4"><div class="schedule-day-date" id="schedule-date-4"></div><div class="schedule-day-name">周四</div></div>
            <div class="schedule-header-day" id="schedule-day-5"><div class="schedule-day-date" id="schedule-date-5"></div><div class="schedule-day-name">周五</div></div>
            <div class="schedule-header-day schedule-header-weekend" id="schedule-day-6"><div class="schedule-day-date" id="schedule-date-6"></div><div class="schedule-day-name">周六</div></div>
            <div class="schedule-header-day schedule-header-weekend" id="schedule-day-7"><div class="schedule-day-date" id="schedule-date-7"></div><div class="schedule-day-name">周日</div></div>
        </div>
        <div class="schedule-grid">
            <div class="schedule-timeline">
                <div class="timeline-item"><div class="timeline-section">1</div><div class="timeline-time-start">08:20</div><div class="timeline-time-end">09:05</div></div>
                <div class="timeline-item"><div class="timeline-section">2</div><div class="timeline-time-start">09:15</div><div class="timeline-time-end">10:00</div></div>
                <div class="timeline-item"><div class="timeline-section">3</div><div class="timeline-time-start">10:15</div><div class="timeline-time-end">11:00</div></div>
                <div class="timeline-item"><div class="timeline-section">4</div><div class="timeline-time-start">11:10</div><div class="timeline-time-end">11:55</div></div>
                <div class="timeline-item"><div class="timeline-section">5</div><div class="timeline-time-start">14:10</div><div class="timeline-time-end">14:55</div></div>
                <div class="timeline-item"><div class="timeline-section">6</div><div class="timeline-time-start">15:05</div><div class="timeline-time-end">15:50</div></div>
                <div class="timeline-item"><div class="timeline-section">7</div><div class="timeline-time-start">16:05</div><div class="timeline-time-end">16:50</div></div>
                <div class="timeline-item"><div class="timeline-section">8</div><div class="timeline-time-start">17:00</div><div class="timeline-time-end">17:45</div></div>
                <div class="timeline-item timeline-item-evening"><div class="timeline-section">9</div><div class="timeline-time-start">19:00</div><div class="timeline-time-end">19:45</div></div>
                <div class="timeline-item timeline-item-evening"><div class="timeline-section">10</div><div class="timeline-time-start">19:55</div><div class="timeline-time-end">20:40</div></div>
            </div>
            <div class="schedule-days" id="schedule-days"></div>
        </div>
    </div>
    <div class="week-selector">
        <button class="btn-secondary btn-sm" onclick="changeWeek(-1)">上一周</button>
        <select id="week-select" class="week-select" onchange="jumpToWeek(parseInt(this.value))"></select>
        <button class="btn-secondary btn-sm" onclick="changeWeek(1)">下一周</button>
    </div>
    <div class="action-bar">
        <button class="btn-secondary" onclick="cachedSchedule=null;loadSchedule()">刷新显示</button>
        <button class="btn-primary" onclick="updateScheduleData()">更新课程表</button>
    </div>
</div>
