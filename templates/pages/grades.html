<div id="grades-menu" class="grades-menu">
    <button class="grade-action-btn grade-action-btn-summary" onclick="gradesLoadLatestSummary()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>
        <span class="grade-action-label">一键查本学期成绩</span>
        <span class="grade-action-desc">自动汇总最新学期及格成绩和不及格成绩</span>
    </button>
    <button class="grade-action-btn" onclick="gradesShowCurrentSemester()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span class="grade-action-label">本学期成绩</span>
        <span class="grade-action-desc">查询当前学期课程成绩</span>
    </button>
    <button class="grade-action-btn" onclick="gradesShowSemesterPicker()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span class="grade-action-label">历史及格成绩</span>
        <span class="grade-action-desc">按学期查询历史及格课程成绩</span>
    </button>
    <button class="grade-action-btn grade-action-btn-warn" onclick="gradesLoadFailed()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span class="grade-action-label">不及格成绩</span>
        <span class="grade-action-desc">查询所有学期不及格课程</span>
    </button>
    <button class="grade-action-btn grade-action-btn-accent" onclick="gradesLoadGpa()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span class="grade-action-label">学分绩点</span>
        <span class="grade-action-desc">查询学分绩点与学位绩点</span>
    </button>
    <button class="grade-action-btn" onclick="gradesShowExamPicker()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span class="grade-action-label">考试成绩</span>
        <span class="grade-action-desc">补考成绩也在这里查询</span>
    </button>
</div>
<div id="grades-result" style="display:none;">
    <button class="grades-back-btn" onclick="gradesBackToMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        返回
    </button>
    <div class="card grades-container">
        <h2 id="grades-result-title"></h2>
        <div id="grades-content" class="grades-content"></div>
    </div>
</div>
