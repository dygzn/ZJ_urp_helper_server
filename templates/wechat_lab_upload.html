<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>上传本地 PDF · 实验提交</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layers.css') }}?v=20261124">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/taste-theme.css') }}?v=20261124">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/wechat-lab-upload.css') }}?v=20261124">
  <script defer src="{{ url_for('static', filename='js/wechat-lab-upload.js') }}?v=20261124"></script>
</head>
<body>
  <main>
    <button id="back" type="button">返回实验提交</button>
    <h1>上传本地 PDF</h1>
    <p class="hint">仅支持 PDF，大小不超过 20MB。上传凭证在 10 分钟内有效。</p>
    <section aria-label="本次报告">
      <p id="context">正在读取报告信息…</p>
      <form id="upload-form">
        <label for="pdf">选择手机中的 PDF 文件</label>
        <input id="pdf" type="file" accept=".pdf,application/pdf" required disabled aria-describedby="file-info">
        <p id="file-info" class="hint">尚未选择文件</p>
        <button id="submit" class="primary" type="submit" disabled>上传报告</button>
      </form>
      <progress id="progress" max="100" value="0" hidden aria-label="报告上传进度"></progress>
      <p id="message" role="status" aria-live="polite">请稍候</p>
    </section>
    <p class="hint">上传后返回小程序核对报告状态。发送后不会自动重传。</p>
    <noscript><p>请在微信中开启 JavaScript 后，返回小程序重新打开上传页面。</p></noscript>
  </main>
</body>
</html>
