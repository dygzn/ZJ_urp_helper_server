<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../static/css/style.css">
    <title>历年课表布局测试</title>
</head>
<body>
    <div id="historical-schedule-modal" class="modal active">
        <div class="modal-content historical-schedule-modal-content">
            <h2>历年课表查询</h2>
            <p class="modal-desc">选择学期后展示该学期全部课程</p>
            <label class="historical-schedule-select-wrap">
                <span>学年学期</span>
                <select><option>2026-2027学年秋</option></select>
            </label>
            <div id="historical-schedule-body" class="historical-schedule-body"></div>
        </div>
    </div>
    <script src="../../static/js/schedule-layout.js"></script>
    <script>
        const courses = Array.from({ length: 10 }, (_, index) => ({
            '课程名': `第${index + 1}节示例课程`,
            '星期': String((index % 7) + 1),
            '节次': String(index + 1),
            '节数': '1',
            '位置': '仙林校区实C-501',
            '课序': '01',
        }));
        document.getElementById('historical-schedule-body').innerHTML =
            buildHistoricalScheduleGridHtml(courses);
    </script>
</body>
</html>
